server {
  # Render terminates TLS and proxies plain HTTP to the container on port 80.
  listen 80;

  # Accept any host (Render assigns <service>.onrender.com).
  server_name _;

  # Must be an absolute path: /start.sh rewrites the built-in config's
  # "root /var/www/html;" via sed BEFORE it copies this file into place, so
  # WEBROOT has no effect here.
  root /var/www/html/public;
  index index.php;

  # Restored by /start.sh when REAL_IP_HEADER=1 so logs show real client IPs.
  #real_ip_header X-Forwarded-For;
  #set_real_ip_from 172.16.0.0/12;

  charset utf-8;
  sendfile off;

  # Validation caps uploads at 2-4 MB; leave a little headroom.
  client_max_body_size 12M;

  # Render scrapes these for the live log stream.
  access_log /dev/stdout;
  error_log  /dev/stderr info;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Never expose repository metadata.
  location /.git {
    deny all;
    return 403;
  }

  # Laravel front controller: anything that is not a real file falls through
  # to index.php, which prevents the 404s that hit /index.php directly.
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  # Block dotfiles and deployment/source files that must never be public.
  location ~ /\.(?!well-known) {
    deny all;
  }

  location ~* ^/(?:\.env.*|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml|README\.md|artisan)$ {
    deny all;
  }

  # Uploads are served by nginx; PHP must never execute inside storage/.
  location ~* ^/storage/.*\.php$ {
    deny all;
  }

  # Immutable-ish static assets.
  location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
  }

  # PHP-FPM over the unix socket created by the base image.
  location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    include fastcgi_params;
  }

  # Route unknown paths through Laravel so the app renders its own 404 page.
  error_page 404 /index.php;
}
